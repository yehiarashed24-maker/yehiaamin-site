<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="huaweiRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A3B"/>
      <stop offset="100%" stop-color="#C7000B"/>
    </linearGradient>
    <linearGradient id="huaweiBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141518"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Surface -->
  <rect width="800" height="450" rx="32" fill="url(#huaweiBg)"/>
  <rect width="794" height="444" x="3" y="3" rx="30" fill="none" stroke="#FF2A3B" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Official Huawei 8-Petal Red Flower Emblem -->
  <g transform="translate(400, 140) scale(1.2)" filter="url(#glow)">
    <path d="M0,0 C-7,-30 -2,-62 0,-62 C2,-62 7,-30 0,0 Z" fill="url(#huaweiRed)"/>
    <path d="M0,0 C-7,-30 -2,-62 0,-62 C2,-62 7,-30 0,0 Z" fill="url(#huaweiRed)" transform="rotate(22.5)"/>
    <path d="M0,0 C-7,-30 -2,-62 0,-62 C2,-62 7,-30 0,0 Z" fill="url(#huaweiRed)" transform="rotate(-22.5)"/>
    <path d="M0,0 C-7,-30 -2,-62 0,-62 C2,-62 7,-30 0,0 Z" fill="url(#huaweiRed)" transform="rotate(45)"/>
    <path d="M0,0 C-7,-30 -2,-62 0,-62 C2,-62 7,-30 0,0 Z" fill="url(#huaweiRed)" transform="rotate(-45)"/>
    <path d="M0,0 C-7,-30 -2,-62 0,-62 C2,-62 7,-30 0,0 Z" fill="url(#huaweiRed)" transform="rotate(67.5)"/>
    <path d="M0,0 C-7,-30 -2,-62 0,-62 C2,-62 7,-30 0,0 Z" fill="url(#huaweiRed)" transform="rotate(-67.5)"/>
    <path d="M0,0 C-7,-30 -2,-62 0,-62 C2,-62 7,-30 0,0 Z" fill="url(#huaweiRed)" transform="rotate(90)"/>
  </g>

  <!-- Typography -->
  <text x="400" y="285" font-family="'Kanit', sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" text-anchor="middle" letter-spacing="8">HUAWEI</text>
  <text x="400" y="340" font-family="'Kanit', sans-serif" font-weight="600" font-size="24" fill="#FF2A3B" text-anchor="middle" letter-spacing="10">ICT ACADEMY</text>
</svg>
