<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="harvardCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A51C30"/>
      <stop offset="100%" stop-color="#700010"/>
    </linearGradient>
    <linearGradient id="harvardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141518"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Surface -->
  <rect width="800" height="450" rx="32" fill="url(#harvardBg)"/>
  <rect width="794" height="444" x="3" y="3" rx="30" fill="none" stroke="#A51C30" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Harvard Shield Crest -->
  <g transform="translate(400, 140) scale(1.3)" filter="url(#crimsonGlow)">
    <path d="M-45,-55 L45,-55 C45,-55 48,20 0,55 C-48,20 -45,-55 -45,-55 Z" fill="url(#harvardCrimson)" stroke="#FFFFFF" stroke-width="3"/>
    
    <!-- 3 Open Books: VE - RI - TAS -->
    <rect x="-32" y="-40" width="26" height="20" rx="2" fill="#FFFFFF"/>
    <text x="-19" y="-25" font-family="'Times New Roman', Georgia, serif" font-weight="bold" font-size="13" fill="#A51C30" text-anchor="middle">VE</text>

    <rect x="6" y="-40" width="26" height="20" rx="2" fill="#FFFFFF"/>
    <text x="19" y="-25" font-family="'Times New Roman', Georgia, serif" font-weight="bold" font-size="13" fill="#A51C30" text-anchor="middle">RI</text>

    <rect x="-13" y="-10" width="26" height="20" rx="2" fill="#FFFFFF"/>
    <text x="0" y="5" font-family="'Times New Roman', Georgia, serif" font-weight="bold" font-size="11" fill="#A51C30" text-anchor="middle">TAS</text>
  </g>

  <!-- Typography -->
  <text x="400" y="290" font-family="'Kanit', sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" text-anchor="middle" letter-spacing="8">HARVARDX</text>
  <text x="400" y="345" font-family="'Kanit', sans-serif" font-weight="600" font-size="22" fill="#A51C30" text-anchor="middle" letter-spacing="10">HARVARD UNIVERSITY</text>
</svg>
